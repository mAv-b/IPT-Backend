<!-- BASED ON clearable_file_input.html -->

<div class="landscape" id="m_file_input_container">
    

        <div {% include "django/forms/widgets/attrs.html" with widget=preview_container %}>
            
        </div>
        
        <div {% include "django/forms/widgets/attrs.html" with widget=detail_container %}>
            <span name="file-name"><b>File Name: </b><span>{{widget.body.archive_name}}</span></span>
            <span name="file-mime-type"><b>Type: </b><span>{{ widget.body.archive_mime_type }}</span></span>
            <span name="file-size"><b>Size: </b><span>{{ widget.body.archive_size }}</span></span>
            <span name="url-preview"><b>URL: </b><a target="_blank" href="{{ widget.body.archive_url }}">{{ widget.body.archive_url }}</a></span>
        </div>

    <!-- {% if widget.is_initial %}
        <p class="file-upload">
            {{ widget.initial_text }}: <a href="{{ widget.value.url }}">{{ widget.value }}</a>
        </p>
        {% if not widget.required %}
            <span class="clearable-file-input">
                <input type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}"{% if widget.attrs.disabled %} disabled{% endif %}{% if widget.attrs.checked %} checked{% endif %}>
                <label for="{{ widget.checkbox_id }}">{{ widget.clear_checkbox_label }}</label></span>
        {% endif %}
    {% endif %}
    <br> -->

    <label for="{{ widget.attrs.id }}">
        <!-- {{ widget.input_text }}: -->
        <input id="{{ widget.attrs.id }}" type="{{ widget.type }}" name="{{ widget.name }}"{% include "django/forms/widgets/attrs.html" %}>
        <div>
            <svg name="icon-upload" viewBox="0 0 24 24" width="24" height="24"
                fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"
                aria-hidden="true">
                <path d="M12 16V4" />
                <path d="m7 9 5-5 5 5" />
                <path d="M5 20h14" />
            </svg>
            <template id="icon-image">
                <svg name="icon-image" width="24" height="24" viewBox="-64 0 512 512" fill="currentColor" role="img" aria-label="Arquivo de imagem">

                        </path>
                </svg>
            </template>
            <template id="icon-video">
                <svg name="icon-video" width="24" height="24" viewBox="-64 0 512 512" fill="currentColor" role="img" aria-label="Arquivo de vídeo">
                        <path d="M320 464c8.8 0 16-7.2 16-16l0-288-80 0c-17.7 0-32-14.3-32-32l0-80L64 48c-8.8 0-16 7.2-16 16l0 384c0 8.8 7.2 16 16 16l256 0zM0 64C0 28.7 28.7 0 64 0L229.5 0c17 0 33.3 6.7 45.3 18.7l90.5 90.5c12 12 18.7 28.3 18.7 45.3L384 448c0 35.3-28.7 64-64 64L64 512c-35.3 0-64-28.7-64-64L0 64zM80 288c0-17.7 14.3-32 32-32l96 0c17.7 0 32 14.3 32 32l0 16 44.9-29.9c2-1.3 4.4-2.1 6.8-2.1 6.8 0 12.3 5.5 12.3 12.3l0 103.4c0 6.8-5.5 12.3-12.3 12.3-2.4 0-4.8-.7-6.8-2.1L240 368l0 16c0 17.7-14.3 32-32 32l-96 0c-17.7 0-32-14.3-32-32l0-96z">
                </path>
                        </svg>
            </template>
            <template id="icon-audio">
                <svg name="icon-audio" width="24" height="24" viewBox="-64 0 512 512" fill="currentColor" role="img" aria-label="Arquivo de áudio">
                        <path d="M64 464l256 0c8.8 0 16-7.2 16-16l0-288-80 0c-17.7 0-32-14.3-32-32l0-80L64 48c-8.8 0-16 7.2-16 16l0 384c0 8.8 7.2 16 16 16zM0 64C0 28.7 28.7 0 64 0L229.5 0c17 0 33.3 6.7 45.3 18.7l90.5 90.5c12 12 18.7 28.3 18.7 45.3L384 448c0 35.3-28.7 64-64 64L64 512c-35.3 0-64-28.7-64-64L0 64zM192 272l0 128c0 6.5-3.9 12.3-9.9 14.8s-12.9 1.1-17.4-3.5L129.4 376 112 376c-8.8 0-16-7.2-16-16l0-48c0-8.8 7.2-16 16-16l17.4 0 35.3-35.3c4.6-4.6 11.5-5.9 17.4-3.5s9.9 8.3 9.9 14.8zm85.8-4c11.6 20 18.2 43.3 18.2 68s-6.6 48-18.2 68c-6.6 11.5-21.3 15.4-32.8 8.8s-15.4-21.3-8.8-32.8c7.5-12.9 11.8-27.9 11.8-44s-4.3-31.1-11.8-44c-6.6-11.5-2.7-26.2 8.8-32.8s26.2-2.7 32.8 8.8z">
                </path>
                        </svg>
            </template>
            <template id="icon-pdf">
                <svg name="icon-pdf" width="24" height="24" viewBox="0 0 512 512" fill="currentColor" role="img" aria-label="Arquivo de pdf">
                        <path d="M64 464l48 0 0 48-48 0c-35.3 0-64-28.7-64-64L0 64C0 28.7 28.7 0 64 0L229.5 0c17 0 33.3 6.7 45.3 18.7l90.5 90.5c12 12 18.7 28.3 18.7 45.3L384 304l-48 0 0-144-80 0c-17.7 0-32-14.3-32-32l0-80L64 48c-8.8 0-16 7.2-16 16l0 384c0 8.8 7.2 16 16 16zM176 352l32 0c30.9 0 56 25.1 56 56s-25.1 56-56 56l-16 0 0 32c0 8.8-7.2 16-16 16s-16-7.2-16-16l0-48 0-80c0-8.8 7.2-16 16-16zm32 80c13.3 0 24-10.7 24-24s-10.7-24-24-24l-16 0 0 48 16 0zm96-80l32 0c26.5 0 48 21.5 48 48l0 64c0 26.5-21.5 48-48 48l-32 0c-8.8 0-16-7.2-16-16l0-128c0-8.8 7.2-16 16-16zm32 128c8.8 0 16-7.2 16-16l0-64c0-8.8-7.2-16-16-16l-16 0 0 96 16 0zm80-112c0-8.8 7.2-16 16-16l48 0c8.8 0 16 7.2 16 16s-7.2 16-16 16l-32 0 0 32 32 0c8.8 0 16 7.2 16 16s-7.2 16-16 16l-32 0 0 48c0 8.8-7.2 16-16 16s-16-7.2-16-16l0-64 0-64z">
                </path>
                        </svg>
            </template>
            <template id="icon-file">
                <svg name="icon-file" width="24" height="24" viewBox="-64 0 512 512" fill="currentColor" role="img" aria-label="Arquivo de genérico">
                        <path d="M320 464c8.8 0 16-7.2 16-16l0-288-80 0c-17.7 0-32-14.3-32-32l0-80L64 48c-8.8 0-16 7.2-16 16l0 384c0 8.8 7.2 16 16 16l256 0zM0 64C0 28.7 28.7 0 64 0L229.5 0c17 0 33.3 6.7 45.3 18.7l90.5 90.5c12 12 18.7 28.3 18.7 45.3L384 448c0 35.3-28.7 64-64 64L64 512c-35.3 0-64-28.7-64-64L0 64z">
                </path>
                        </svg>
            </template>
            <template id="icon-upload">
                <svg name="icon-upload" viewBox="0 0 24 24" width="24" height="24"
                                fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round"
                                aria-hidden="true">
                                <path d="M12 16V4" />
                                <path d="m7 9 5-5 5 5" />
                                <path d="M5 20h14" />
                            </svg>
            </template>
            <!-- <div>
                <p>Select Archive</p>
            </div> -->
        </div>
        <div>
            <p>Escolha um arquivo ou arraste-o aqui</p>
            <small>Imagem, áudio, vídeo, PDF ou outro formato aceito</small>
        </div>
    </label>

    <template id="audio-player-play-icon">
        <svg
            class="player-icon play-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
        >
            <path d="M8 5.8v12.4c0 .8.9 1.3 1.6.8l9.1-6.2a1 1 0 0 0 0-1.6L9.6 5c-.7-.5-1.6 0-1.6.8Z"/>
        </svg>
    </template>
    <template id="audio-player-pause-icon">
        <svg
            class="player-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
        >
            <rect x="7" y="5" width="3.5" height="14" rx="1"/>
            <rect x="13.5" y="5" width="3.5" height="14" rx="1"/>
        </svg>
    </template>
</div>
